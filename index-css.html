<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CUADRO CON CSS</title>
    <style>
        body {
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .contenedor {
            width: 500px;
            height: 300px;
            background-color: #d1e7bc; 
            position: relative;
        }
        
        .l1 {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            height: 4px;
            background-color: #b8860b;
        }
        .l2 {
            position: absolute;
            top: 20px;
            left: 10px;
            right: 10px;
            height: 4px;
            background-color: #b8860b;
        }
        
        .izq {
            position: absolute;
            top: 10px;
            bottom: 10px;
            left: 10px;
            width: 10px;
            background-color: #1a3a5a;
        }
        
        .abajo {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            height: 2px;
            background-color: #5bc0de;
        }
        
        .der {
            position: absolute;
            right: 10px;
            width: 8px;
            background-color: #7a2a95;
        }
        
        .d1 { top: 30px; height: 50px; }
        .d2 { top: 100px; height: 50px; }
        .d3 { top: 170px; height: 50px; }
        
        
        .d4 { 
            bottom: 12px; 
            height: 50px; 
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <div class="l1"></div>
        <div class="l2"></div>
        <div class="izq"></div>
        <div class="abajo"></div>
        <div class="der d1"></div>
        <div class="der d2"></div>
        <div class="der d3"></div>
        <div class="der d4"></div>
    </div>

</body>
</html>
